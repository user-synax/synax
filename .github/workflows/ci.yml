name: CI

# Test and typecheck on every push (all branches and v* tags); publish to npm
# when a v* tag is pushed. `workflow_dispatch` allows running the test job
# manually from the Actions tab.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# Skip superseded runs on the same branch or tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The project keeps zero dependencies — including dev-time ones — so
      # TypeScript is installed as a global CLI here rather than added to
      # package.json. Pin the major for deterministic checks.
      - name: Install TypeScript
        run: bun install -g typescript@6

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  publish:
    name: Publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install TypeScript
        run: bun install -g typescript@6

      - name: Build
        run: bun run build

      # Release-safety guard: refuse to publish when the pushed tag does not
      # match the version declared in package.json (v1.2.3 <-> "version": "1.2.3").
      - name: Check tag matches package version
        run: |
          PKG_VERSION="v$(bun -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      # `npm publish` re-runs the prepublishOnly gate (bun test && typecheck &&
      # build) before uploading, so a red gate blocks the release here too.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
